name: reproducibility checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install pandas==2.2.2 numpy==1.26.4 pytest==8.2.1
      - run: python -m compileall -q src scripts
      - run: pytest -q
